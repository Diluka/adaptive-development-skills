name: Hook CI

on:
  pull_request:
    paths:
      - "hooks/**"
      - ".github/workflows/hook-ci.yml"
  push:
    branches:
      - main
    paths:
      - "hooks/**"
      - ".github/workflows/hook-ci.yml"

permissions:
  contents: read

jobs:
  ubuntu:
    name: Ubuntu hook checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Deno 2.9.4
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.4

      - name: Install Node 24.15.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0

      - name: Check Hook types, syntax, and logic
        shell: bash
        run: |
          set -euo pipefail
          deno fmt --check hooks/codex-hook-types.ts hooks/task-handoff.ts hooks/tests/task-handoff.test.ts
          deno lint --no-config hooks/codex-hook-types.ts hooks/task-handoff.ts hooks/tests/task-handoff.test.ts
          deno check --no-config --no-lock --no-npm --no-remote hooks/codex-hook-types.ts hooks/task-handoff.ts
          node --check hooks/codex-hook-types.ts
          node --check hooks/task-handoff.ts
          sh -n hooks/run-task-handoff.sh
          test -x hooks/run-task-handoff.sh
          deno test --no-config --no-lock --no-npm --no-remote --allow-read --allow-write --allow-run=deno hooks/tests/task-handoff.test.ts

      - name: Smoke test POSIX launchers
        shell: bash
        run: |
          set -euo pipefail

          workspace=$(pwd -P)
          expected_head=$(git rev-parse --verify HEAD)
          real_node=$(command -v node)
          real_mkdir=$(command -v mkdir)

          write_input() {
            local path=$1
            local session=$2
            "$real_node" -e '
              const fs = require("node:fs");
              const [path, session, cwd] = process.argv.slice(1);
              fs.writeFileSync(path, JSON.stringify({
                session_id: session,
                transcript_path: null,
                cwd,
                model: "ci-model",
                hook_event_name: "UserPromptSubmit",
                permission_mode: "default",
                turn_id: "ci-turn",
                prompt: "Validate the launcher path."
              }));
            ' "$path" "$session" "$workspace"
          }

          assert_checkpoint() {
            local data_root=$1
            local session=$2
            local output=$3
            local expected_hash
            expected_hash=$("$real_node" -e '
              const { createHash } = require("node:crypto");
              process.stdout.write(createHash("sha256").update(process.argv[1]).digest("hex"));
            ' "$session")
            local state_file="$data_root/handoffs/$expected_hash/state.md"

            "$real_node" -e '
              const fs = require("node:fs");
              const value = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
              if (value?.hookSpecificOutput?.hookEventName !== "UserPromptSubmit") {
                throw new Error("unexpected hook output");
              }
            ' "$output"
            test "$(find "$data_root" -type f -name state.md | wc -l)" -eq 1
            test -f "$state_file"
            grep -Fqx "session_hash: $expected_hash" "$state_file"
            grep -Fqx "cwd: $("$real_node" -e 'process.stdout.write(JSON.stringify(process.argv[1]))' "$workspace")" "$state_file"
            grep -Fqx "git_head: \"$expected_head\"" "$state_file"
            grep -Fqx "status: complete" "$state_file"
            test "$(stat -c %a "$state_file")" = 600
          }

          priority_bin="$RUNNER_TEMP/deno-priority-bin"
          deno_temp="$RUNNER_TEMP/task-handoff-deno-temp"
          deno_data="$deno_temp/adaptive-development-skills-task-handoff"
          deno_input="$RUNNER_TEMP/task-handoff-deno.json"
          deno_output="$RUNNER_TEMP/task-handoff-deno-output.json"
          mkdir -p "$priority_bin"
          printf '#!/bin/sh\nexit 97\n' > "$priority_bin/node"
          chmod +x "$priority_bin/node"
          write_input "$deno_input" "ci-deno-session"
          test ! -e "$deno_temp"
          PATH="$priority_bin:$PATH" TMPDIR="$deno_temp" \
            hooks/run-task-handoff.sh < "$deno_input" > "$deno_output"
          assert_checkpoint "$deno_data" "ci-deno-session" "$deno_output"

          node_bin="$RUNNER_TEMP/node-fallback-bin"
          node_temp="$RUNNER_TEMP/task-handoff-node-temp"
          node_data="$node_temp/adaptive-development-skills-task-handoff"
          node_input="$RUNNER_TEMP/task-handoff-node.json"
          node_output="$RUNNER_TEMP/task-handoff-node-output.json"
          mkdir -p "$node_bin"
          ln -s "$real_node" "$node_bin/node"
          ln -s "$(command -v git)" "$node_bin/git"
          ln -s "$(command -v dirname)" "$node_bin/dirname"
          ln -s "$real_mkdir" "$node_bin/mkdir"
          write_input "$node_input" "ci-node-session"
          test ! -e "$node_temp"
          PATH="$node_bin" TMPDIR="$node_temp" \
            hooks/run-task-handoff.sh < "$node_input" > "$node_output"
          assert_checkpoint "$node_data" "ci-node-session" "$node_output"

      - name: Validate Plugin installation
        shell: bash
        env:
          CODEX_HOME: ${{ runner.temp }}/codex-home
        run: |
          set -euo pipefail
          mkdir -p "$CODEX_HOME"
          npx --yes @openai/codex@0.146.1 plugin marketplace add . --json
          npx --yes @openai/codex@0.146.1 plugin add adaptive-development-skills@adaptive-development-skills --json
          plugin_version=$(node -p "require('./.codex-plugin/plugin.json').version")
          cached_root="$CODEX_HOME/plugins/cache/adaptive-development-skills/adaptive-development-skills/$plugin_version"
          test -x "$cached_root/hooks/run-task-handoff.sh"
          test -f "$cached_root/hooks/run-task-handoff.cmd"
          test -f "$cached_root/hooks/task-handoff.ts"
          test -f "$cached_root/hooks/codex-hook-types.ts"

  mise-node:
    name: mise Node environment probe
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Node 24.15.0 with mise
        uses: jdx/mise-action@v3
        with:
          tool_versions: |
            node 24.15.0

      - name: Probe Node fallback Git environment
        shell: bash
        run: |
          set -euo pipefail

          mise_node=$(realpath "$(mise which node)")
          test "$(node --version)" = "v24.15.0"
          test "$(node -p 'process.execPath')" = "$mise_node"

          workspace=$(pwd -P)
          probe_bin="$RUNNER_TEMP/mise-node-probe-bin"
          temp_root="$RUNNER_TEMP/mise-node-temp"
          task_handoff_data="$temp_root/adaptive-development-skills-task-handoff"
          input="$RUNNER_TEMP/mise-node-input.json"
          output="$RUNNER_TEMP/mise-node-output.json"
          session="ci-mise-node-session"
          probe_head="1111111111111111111111111111111111111111"

          mkdir -p "$probe_bin"
          ln -s "$mise_node" "$probe_bin/node"
          ln -s "$(command -v dirname)" "$probe_bin/dirname"
          ln -s "$(command -v mkdir)" "$probe_bin/mkdir"
          printf '%s\n' \
            '#!/bin/sh' \
            "printf '%s\\n' '$probe_head'" \
            > "$probe_bin/git"
          chmod +x "$probe_bin/git"

          "$mise_node" -e '
            const fs = require("node:fs");
            const [path, session, cwd] = process.argv.slice(1);
            fs.writeFileSync(path, JSON.stringify({
              session_id: session,
              transcript_path: null,
              cwd,
              model: "ci-model",
              hook_event_name: "UserPromptSubmit",
              permission_mode: "default",
              turn_id: "ci-turn",
              prompt: "Probe the mise Node child-process environment."
            }));
          ' "$input" "$session" "$workspace"

          test ! -e "$temp_root"
          test "$(PATH="$probe_bin" command -v node)" = "$probe_bin/node"
          test "$(PATH="$probe_bin" command -v git)" = "$probe_bin/git"
          if PATH="$probe_bin" command -v deno >/dev/null 2>&1; then
            echo "Deno must not be visible in the mise Node probe" >&2
            exit 1
          fi

          PATH="$probe_bin" TMPDIR="$temp_root" \
            hooks/run-task-handoff.sh < "$input" > "$output"

          session_hash=$("$mise_node" -e '
            const { createHash } = require("node:crypto");
            process.stdout.write(createHash("sha256").update(process.argv[1]).digest("hex"));
          ' "$session")
          state_file="$task_handoff_data/handoffs/$session_hash/state.md"
          test -f "$state_file"

          "$mise_node" -e '
            const fs = require("node:fs");
            const [outputPath, statePath, expectedHead] = process.argv.slice(1);
            const output = JSON.parse(fs.readFileSync(outputPath, "utf8"));
            if (output?.hookSpecificOutput?.hookEventName !== "UserPromptSubmit") {
              throw new Error("unexpected Hook JSON output");
            }
            const state = fs.readFileSync(statePath, "utf8");
            const match = /^git_head: (.+)$/m.exec(state);
            const actualHead = match === null ? null : JSON.parse(match[1]);
            if (actualHead !== expectedHead) {
              throw new Error(`Hook used ${actualHead}; expected PATH probe ${expectedHead}`);
            }
          ' "$output" "$state_file" "$probe_head"

  windows:
    name: Windows hook checks
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Deno 2.9.4
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.4

      - name: Install Node 24.15.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0

      - name: Prepare Windows smoke inputs
        id: windows-paths
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $workspace = (Get-Location).ProviderPath
          $nodeExe = (Get-Command node -CommandType Application | Select-Object -First 1).Source
          $gitExe = (Get-Command git -CommandType Application | Select-Object -First 1).Source
          $denoExe = (Get-Command deno -CommandType Application | Select-Object -First 1).Source
          $pluginRoot = Join-Path $env:RUNNER_TEMP "plugin root with spaces"
          [IO.Directory]::CreateDirectory($pluginRoot) | Out-Null
          Copy-Item -LiteralPath (Join-Path $workspace "hooks") -Destination $pluginRoot -Recurse

          foreach ($case in @(
            @{ File = "task-handoff-windows-deno.json"; Session = "ci-windows-deno-session" },
            @{ File = "task-handoff-windows-node.json"; Session = "ci-windows-node-session" }
          )) {
            $input = @{
              session_id = $case.Session
              transcript_path = $null
              cwd = $workspace
              model = "ci-model"
              hook_event_name = "UserPromptSubmit"
              permission_mode = "default"
              turn_id = "ci-turn"
              prompt = "Validate the Windows launcher path."
            } | ConvertTo-Json -Compress
            $path = Join-Path $env:RUNNER_TEMP $case.File
            [IO.File]::WriteAllText($path, $input, [Text.UTF8Encoding]::new($false))
          }

          "node_dir=$(Split-Path -Parent $nodeExe)" >> $env:GITHUB_OUTPUT
          "git_dir=$(Split-Path -Parent $gitExe)" >> $env:GITHUB_OUTPUT
          "plugin_root=$pluginRoot" >> $env:GITHUB_OUTPUT
          "system32=$env:SystemRoot\System32" >> $env:GITHUB_OUTPUT
          "windows_dir=$env:SystemRoot" >> $env:GITHUB_OUTPUT
          Write-Host "Deno: $denoExe"
          Write-Host "Node: $nodeExe"
          Write-Host "Git: $gitExe"

      - name: Smoke test Deno priority through PowerShell and cmd.exe
        shell: pwsh
        env:
          PLUGIN_ROOT: ${{ steps.windows-paths.outputs.plugin_root }}
          TEMP: ${{ runner.temp }}\task-handoff-windows-deno-temp
        run: |
          $ErrorActionPreference = "Stop"
          if (-not (Get-Command deno -CommandType Application)) {
            throw "Deno is not available"
          }
          if (-not (Get-Command node -CommandType Application)) {
            throw "Node is not available"
          }

          $sentinelDir = Join-Path $env:RUNNER_TEMP "deno-priority-sentinel"
          [IO.Directory]::CreateDirectory($sentinelDir) | Out-Null
          [IO.File]::WriteAllText(
            (Join-Path $sentinelDir "node.cmd"),
            "@exit /b 97`r`n",
            [Text.ASCIIEncoding]::new()
          )
          $env:PATH = "$sentinelDir;$env:PATH"

          $hookConfig = Get-Content -LiteralPath "hooks\hooks.json" -Raw | ConvertFrom-Json
          $commands = @(
            $hookConfig.hooks.PSObject.Properties.Value |
              ForEach-Object { $_.hooks } |
              ForEach-Object { $_.commandWindows }
          )
          if ($commands.Count -ne 4 -or ($commands | Select-Object -Unique).Count -ne 1) {
            throw "Configured Windows Hook commands are not identical"
          }
          $commandWindows = $commands[0].Replace('${PLUGIN_ROOT}', $env:PLUGIN_ROOT)
          $startInfo = [Diagnostics.ProcessStartInfo]::new()
          $startInfo.FileName = (Get-Command pwsh.exe -CommandType Application).Source
          $startInfo.ArgumentList.Add("-NoProfile")
          $startInfo.ArgumentList.Add("-Command")
          $startInfo.ArgumentList.Add($commandWindows)
          $startInfo.UseShellExecute = $false
          $startInfo.RedirectStandardInput = $true
          $startInfo.RedirectStandardOutput = $true
          $startInfo.RedirectStandardError = $true

          $process = [Diagnostics.Process]::Start($startInfo)
          $input = [IO.File]::ReadAllText((Join-Path $env:RUNNER_TEMP "task-handoff-windows-deno.json"))
          $process.StandardInput.Write($input)
          $process.StandardInput.Close()
          $stdout = $process.StandardOutput.ReadToEnd()
          $stderr = $process.StandardError.ReadToEnd()
          $process.WaitForExit()
          [Console]::Error.Write($stderr)
          [IO.File]::WriteAllText(
            (Join-Path $env:RUNNER_TEMP "task-handoff-windows-deno-output.json"),
            $stdout,
            [Text.UTF8Encoding]::new($false)
          )
          if ($process.ExitCode -ne 0) {
            throw "PowerShell -> cmd.exe -> Deno launcher failed with $($process.ExitCode)"
          }

      - name: Smoke test Node fallback through cmd.exe
        shell: cmd
        env:
          PLUGIN_ROOT: ${{ steps.windows-paths.outputs.plugin_root }}
          TMP: ${{ runner.temp }}\task-handoff-windows-node-temp
        run: |
          set "PATH=${{ steps.windows-paths.outputs.node_dir }};${{ steps.windows-paths.outputs.git_dir }};${{ steps.windows-paths.outputs.system32 }};${{ steps.windows-paths.outputs.windows_dir }}"
          set "TEMP="
          where deno >nul 2>nul
          if not errorlevel 1 exit /b 91
          where node
          where git
          cmd.exe /d /s /c call "%PLUGIN_ROOT%\hooks\run-task-handoff.cmd" < "%RUNNER_TEMP%\task-handoff-windows-node.json" > "%RUNNER_TEMP%\task-handoff-windows-node-output.json"
          if errorlevel 1 exit /b %errorlevel%

          move /y "%PLUGIN_ROOT%\hooks\task-handoff.ts" "%RUNNER_TEMP%\task-handoff.ts.saved" >nul
          set "TASK_HANDOFF_DATA=%TMP%\adaptive-development-skills-task-handoff"
          node --experimental-strip-types --permission --allow-fs-read="%PLUGIN_ROOT%\hooks\." --allow-fs-read="%TASK_HANDOFF_DATA%" --allow-fs-write="%TASK_HANDOFF_DATA%" --allow-child-process "%PLUGIN_ROOT%\hooks\task-handoff.ts" < "%RUNNER_TEMP%\task-handoff-windows-node.json" >nul 2>nul
          set "DIRECT_EXIT=%ERRORLEVEL%"
          cmd.exe /d /s /c call "%PLUGIN_ROOT%\hooks\run-task-handoff.cmd" < "%RUNNER_TEMP%\task-handoff-windows-node.json" >nul 2>nul
          set "WRAPPER_EXIT=%ERRORLEVEL%"
          move /y "%RUNNER_TEMP%\task-handoff.ts.saved" "%PLUGIN_ROOT%\hooks\task-handoff.ts" >nul
          if "%DIRECT_EXIT%"=="0" exit /b 92
          if not "%WRAPPER_EXIT%"=="%DIRECT_EXIT%" exit /b 93

      - name: Assert Windows launcher results
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $expectedHead = (git -C $env:GITHUB_WORKSPACE rev-parse --verify HEAD).Trim()
          $cases = @(
            @{
              Session = "ci-windows-deno-session"
              TempRoot = Join-Path $env:RUNNER_TEMP "task-handoff-windows-deno-temp"
              Output = Join-Path $env:RUNNER_TEMP "task-handoff-windows-deno-output.json"
            },
            @{
              Session = "ci-windows-node-session"
              TempRoot = Join-Path $env:RUNNER_TEMP "task-handoff-windows-node-temp"
              Output = Join-Path $env:RUNNER_TEMP "task-handoff-windows-node-output.json"
            }
          )

          foreach ($case in $cases) {
            $outputText = [IO.File]::ReadAllText($case.Output)
            if ([string]::IsNullOrWhiteSpace($outputText)) {
              throw "Hook stdout is empty for $($case.Session)"
            }
            $output = $outputText | ConvertFrom-Json
            if ($output.hookSpecificOutput.hookEventName -ne "UserPromptSubmit") {
              throw "Unexpected Hook JSON for $($case.Session): $outputText"
            }

            $sessionBytes = [Text.Encoding]::UTF8.GetBytes($case.Session)
            $sessionHash = [Convert]::ToHexString(
              [Security.Cryptography.SHA256]::HashData($sessionBytes)
            ).ToLowerInvariant()
            $dataRoot = Join-Path $case.TempRoot "adaptive-development-skills-task-handoff"
            $expectedState = Join-Path $dataRoot "handoffs\$sessionHash\state.md"
            $stateFiles = @(Get-ChildItem -LiteralPath $case.TempRoot -Filter state.md -File -Recurse)
            if ($stateFiles.Count -ne 1) {
              throw "Expected exactly one state.md for $($case.Session)"
            }
            if (-not [IO.File]::Exists($expectedState)) {
              throw "Checkpoint path does not match the session hash"
            }
            $lines = [IO.File]::ReadAllLines($expectedState)
            if ($lines[0] -ne "---") {
              throw "Checkpoint metadata header is missing"
            }
            $metadata = @{}
            for ($index = 1; $index -lt $lines.Length; $index++) {
              if ($lines[$index] -eq "---") {
                break
              }
              $separator = $lines[$index].IndexOf(":")
              if ($separator -lt 1) {
                throw "Malformed checkpoint metadata"
              }
              $metadata[$lines[$index].Substring(0, $separator)] =
                $lines[$index].Substring($separator + 1).Trim()
            }

            if ($metadata.session_hash -ne $sessionHash) {
              throw "Checkpoint session hash mismatch"
            }
            if ($metadata.status -ne "complete") {
              throw "Checkpoint is incomplete"
            }
            $savedCwd = $metadata.cwd | ConvertFrom-Json
            if (-not [string]::Equals(
              [IO.Path]::GetFullPath($savedCwd),
              [IO.Path]::GetFullPath($env:GITHUB_WORKSPACE),
              [StringComparison]::OrdinalIgnoreCase
            )) {
              throw "Checkpoint cwd mismatch"
            }
            $savedHead = $metadata.git_head | ConvertFrom-Json
            if ($savedHead -ne $expectedHead) {
              throw "Checkpoint Git HEAD mismatch"
            }
          }
