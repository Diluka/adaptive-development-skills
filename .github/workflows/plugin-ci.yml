name: Plugin CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  plugin:
    name: Plugin checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Node 24.15.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0

      - name: Install plugin and compare skills
        shell: bash
        env:
          CODEX_HOME: ${{ runner.temp }}/codex-home
        run: |
          mkdir -p "$CODEX_HOME"
          npx --yes @openai/codex@0.169.0 plugin marketplace add .
          installed_root=$(npx --yes @openai/codex@0.169.0 plugin add adaptive-development-skills@adaptive-development-skills --json | jq -er '.installedPath')
          diff -qr skills "$installed_root/skills"
