interface:
  display_name: "Development Team Composition"
  short_description: "用户明确要求且运行时许可时，组建团队并组织分工与交接"
  default_prompt: "仅在用户明确要求代理团队协作时，使用 $development-team-composition 先核验当前运行时能力与许可，再在许可范围内组建单负责人直连的同层团队并组织后续协作，确保主会话之外有一名负责人助理成员。能由成员完成的工作都交成员，负责人保留不可替代的沟通、关键决策、专属权限动作及最终对外责任；以现有任务承接目标并停用负责人自动目标模式；在已定需求、范围与授权内渐进派发，按实际成员保守配员并回收验收，区分职责兼任、任务验收与独立评审。"
